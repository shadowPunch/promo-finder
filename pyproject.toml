[project]
name = "promo-finder"
version = "1.0.0"
description = "Find, re-cut and rank 20-60 s microdrama promos by predicted engagement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "wandb>=0.17",
]

[project.scripts]
promo-finder = "promo_finder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promo_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
