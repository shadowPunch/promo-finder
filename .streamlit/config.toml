# Theme for the showcase site (showcase/). Community Cloud only reads config from the repo root.
[theme]
base = "light"
primaryColor = "#B42318"
backgroundColor = "#FAF7F0"
secondaryBackgroundColor = "#F2EDE3"
textColor = "#1C1B19"
borderColor = "#E4DED3"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap, serif"
codeFont = "'Courier Prime':https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap, monospace"

[client]
toolbarMode = "minimal"
